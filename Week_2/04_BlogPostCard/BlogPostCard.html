<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post Card</title>
    <link rel="stylesheet" href="BlogPostCard.css">
</head>
<body>
    <div class="blog-post-card">
        <img class="post-img" src="https://cdn.freecodecamp.org/curriculum/labs/cover-photo.jpg" alt="A scenic mountain landscape under a cloudy sky">
        <div class="post-content">
            <h2 class="post-title">Mastering Modern Web Architecture</h2>
            <p class="post-excerpt">Discover how combining clean system design principles with modern frontend frameworks can drastically improve your workflow and performance.</p>
            <a class="read-more" href="#">Read More</a>
        </div>
    </div>
</body>
</html>
