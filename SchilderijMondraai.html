<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schilderij Mondraai</title>
    <link rel="stylesheet" href="SchilderijMondraai.css">
</head>
<body>

    <div class="mondriaan-canvas">
        <!-- Bovenste rij (hoogte 300px) -->
        <div class="row top-row">
            <!-- Kolom 1 (150px): A (50px) + F (250px) -->
            <div class="col col-1">
                <div class="cell a">A</div>
                <div class="cell f">F</div>
            </div>

            <!-- Vlak B (300px) -->
            <div class="cell b">B</div>

            <!-- Vlak C (50px) -->
            <div class="cell c">C</div>

            <!-- Kolom 4 (400px): D (50px) + G (250px) -->
            <div class="col col-4">
                <div class="cell d">D</div>
                <div class="cell g">G</div>
            </div>

            <!-- Kolom 5 (100px): E (50px) + H (250px) -->
            <div class="col col-5">
                <div class="cell e">E</div>
                <div class="cell h">H</div>
            </div>
        </div>

        <!-- Onderste rij (hoogte 300px) -->
        <div class="row bottom-row">
            <!-- Vlak I (150px) -->
            <div class="cell i">I</div>

            <!-- Vlak J (450px: 300 + 50 + 100) -->
            <div class="cell j">J</div>

            <!-- Vlak K (250px) -->
            <div class="cell k">K</div>

            <!-- Vlak L (50px) -->
            <div class="cell l">L</div>

            <!-- Vlak M (100px) -->
            <div class="cell m">M</div>
        </div>
    </div>

</body>
</html>
