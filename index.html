<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio Hub</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #60a5fa;
            --border: #334155;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        h1 {
            font-size: 2.5rem;
            margin: 0 0 0.5rem 0;
            letter-spacing: -0.025em;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin: 0;
        }

        nav {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.25rem;
            width: 90%;
            max-width: 650px;
            padding: 0 1rem;
        }

        nav a {
            background-color: var(--card-bg);
            color: var(--text-main);
            text-decoration: none;
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            text-align: center;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        nav a:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
            color: var(--accent-hover);
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.2);
        }

        footer {
            margin-top: 3rem;
            color: var(--text-muted);
            font-size: 0.875rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Project Hub</h1>
        <p class="subtitle">Select a project or workshop to explore</p>
    </header>

    <nav>
        <a href="./RecipePage.html">Recipe Page</a>
        <a href="./CatBlog.html">Cat Blog</a>
        <a href="./HotelFeedback.html">Hotel Feedback</a>
        <a href="./BookTable.html">Book Catalog</a>
        <a href="./Cafe.html">Cafe Menu</a>
        <a href="./BusinessCard.html">Business Card</a>
        <a href="./BlogPostCard.html">Blog Post Card</a>
        <a href="./JobApplicationForm.html">Job Application Form</a>
        <a href="./RothkoPainting.html">Rothko Painting</a>
    </nav>

    <footer>
        <p>&copy; 2026 • Built with clean code</p>
    </footer>

</body>
</html>
