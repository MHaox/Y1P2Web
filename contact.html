<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigatiemenu -->
    <nav class="navbar">
        <a href="index.html">CV</a>
        <a href="fotoboek.html">Fotoboek</a>
        <a href="contact.html" class="active">Contact</a>
    </nav>

    <header class="page-header">
        <h1>Contactformulier</h1>
        <p class="subtitle">Neem gerust contact met mij op</p>
    </header>

    <main class="content-container">
        <div class="form-card">
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="name">Volledige naam:</label>
                    <input type="text" id="name" name="name" required placeholder="Bijv. Jan de Vries">
                </div>

                <div class="form-group">
                    <label for="email">E-mailadres:</label>
                    <input type="email" id="email" name="email" required placeholder="jouw@email.nl">
                </div>

                <div class="form-group">
                    <label for="subject">Onderwerp:</label>
                    <select id="subject" name="subject">
                        <option value="info">Algemene informatie</option>
                        <option value="werk">Werk / Vacature</option>
                        <option value="opleiding">Opleiding / Stage</option>
                        <option value="hobbys">Hobby's & Projecten</option>
                        <option value="overig">Overig</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">Je bericht:</label>
                    <textarea id="message" name="message" rows="6" required placeholder="Waar kan ik je mee helpen?"></textarea>
                </div>

                <button type="submit" class="submit-btn">Verstuur Bericht</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Max Robert Hoogeweg</p>
    </footer>

</body>
</html>
